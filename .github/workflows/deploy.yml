name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git-blame author extraction

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font build tools
        run: |
          python -m pip install -r scripts/requirements-fonts.txt
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Fetch font sources from R2
        env:
          BLOG_R2_CONFIG: ${{ secrets.BLOG_R2_CONFIG }}
        run: |
          node -e "if (!process.env.BLOG_R2_CONFIG) throw new Error('Missing BLOG_R2_CONFIG secret'); require('node:fs').writeFileSync('config.json', process.env.BLOG_R2_CONFIG, { mode: 0o600 });"
          pnpm run fetch:ud-fonts

      - name: Build (Next.js → OpenNext → Cloudflare Worker)
        run: pnpm exec opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        run: pnpm exec opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove temporary font inputs and credentials
        if: always()
        run: rm -rf config.json public/fonts/UD public/fonts/UD_subset .next .open-next
